name = "neomailserver"
main = "src/index.js"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "neomailserver"
database_id = "ccf65664-c515-46b9-93f7-1278fd142b13"
migrations_dir = "migrations"

[[routes]]
pattern = "mail.neopathshala.com"
custom_domain = true

[triggers]
crons = ["17 2 * * *"]

[vars]
DEFAULT_SENDER = "no-reply@mail.neopathshala.com"
DEFAULT_SENDER_NAME = "neoMailer"
FALLBACK_ORDER = "resend,brevo,mailgun,mailtrap,mailersend"
REQUEST_TIMEOUT_MS = "6000"
MAX_LOGIN_ATTEMPTS = "5"
API_RATE_LIMIT_PER_MINUTE = "60"
WEBHOOK_RATE_LIMIT_PER_MINUTE = "120"
RETENTION_DAYS = "30"
STORE_MESSAGE_BODIES = "false"
# Production must never inherit the local-development bypass.
LOCAL_DEV = "false"

# Secrets are intentionally NOT stored in this file. Set them with:
#   npx wrangler secret put CONFIG_ENCRYPTION_KEY   # 32 random bytes, base64
#   npx wrangler secret put ADMIN_TOKEN_HASH        # only if ALLOW_TOKEN_LOGIN=true
#   npx wrangler secret put LOCAL_ADMIN_TOKEN       # only for loopback development
#   npx wrangler secret put SMTP_PASS               # optional deployment OTP relay
# Provider keys are encrypted in Database from the admin panel and never committed.

# Set these before production admin access. No production bypass is provided.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ALLOW_TOKEN_LOGIN = "false"
EMAIL_OTP_LOGIN = "true"

# Module bundling only includes imports of src/index.js; no manual upload rules needed.
