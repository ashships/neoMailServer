name = "neomail-server"
main = "src/index.js"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "neomail-db"
database_id = "your-d1-database-id-here"
migrations_dir = "migrations"

# Confirm ownership and spelling before enabling the custom domain.
# [[routes]]
# pattern = "mail.neopathshala.com"
# custom_domain = true

[triggers]
crons = ["17 2 * * *"]

[vars]
DEFAULT_SENDER = "no-reply@mail.neopathshala.com"
DEFAULT_SENDER_NAME = "neoPpathshala"
FALLBACK_ORDER = "resend,brevo,mailgun,mailtrap,mailersend"
REQUEST_TIMEOUT_MS = "6000"
MAX_LOGIN_ATTEMPTS = "5"
API_RATE_LIMIT_PER_MINUTE = "60"
WEBHOOK_RATE_LIMIT_PER_MINUTE = "120"
RETENTION_DAYS = "30"
STORE_MESSAGE_BODIES = "false"
# Set these before production admin access. No production bypass is provided.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
