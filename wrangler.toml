name = "neomailserver"
main = "src/index.js"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "neomailserver"
database_id = "ccf65664-c515-46b9-93f7-1278fd142b13"
migrations_dir = "migrations"

[[routes]]
pattern = "mail.neopathshala.com"
custom_domain = true

[triggers]
crons = ["17 2 * * *"]

[vars]
DEFAULT_SENDER = "no-reply@mail.neopathshala.com"
DEFAULT_SENDER_NAME = "neoPathshala"
FALLBACK_ORDER = "resend,brevo,mailgun,mailtrap,mailersend"
REQUEST_TIMEOUT_MS = "6000"
MAX_LOGIN_ATTEMPTS = "20"
API_RATE_LIMIT_PER_MINUTE = "60"
WEBHOOK_RATE_LIMIT_PER_MINUTE = "120"
RETENTION_DAYS = "30"
STORE_MESSAGE_BODIES = "false"
REQUIRES_CLOUDFLARE_PROXY = "true"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_USER = "user@example.com"
SMTP_PASS = "REDACTED_SMTP_PASS"
SMTP_SECURE = "true"
# Set these before production admin access. No production bypass is provided.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ALLOW_TOKEN_LOGIN = "false"
ADMIN_TOKEN_HASH = "b5ef6551b74b86c40a34a863e6f3111b0a9fc0e67180101939c5c10ffa2a018a"
EMAIL_OTP_LOGIN = "true"

[[upload.rules]]
include = ["src/**/*.js"]
exclude = [".env*", "test/**", "docs/**", "migrations/**", "*.md", ".git/**"]
