<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="eggbot-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e3b2e" />
      <stop offset="60%" stop-color="#08281f" />
      <stop offset="100%" stop-color="#041712" />
    </radialGradient>

    <!-- Metallic Robot Chassis Gradient -->
    <linearGradient id="eggbot-chassis" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a4bab3" />
      <stop offset="35%" stop-color="#8ba19a" />
      <stop offset="85%" stop-color="#697f78" />
      <stop offset="100%" stop-color="#556963" />
    </linearGradient>

    <!-- Antenna Glow -->
    <radialGradient id="eggbot-antenna-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Visor Glass Gradient -->
    <linearGradient id="eggbot-visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13231f" />
      <stop offset="100%" stop-color="#091512" />
    </linearGradient>

    <!-- LED Eye Glow -->
    <filter id="eggbot-eye-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tech Circuit Ring Gradient -->
    <linearGradient id="eggbot-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Circular Avatar Frame -->
  <circle cx="256" cy="256" r="248" fill="url(#eggbot-bg)" stroke="#10b981" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer Tech Circuit Ring (Rotated Accent) -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#eggbot-ring)" stroke-width="2" stroke-dasharray="16 8 4 8 32 12" opacity="0.6" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.2" />

  <!-- Backdrop Glow behind Robot Head -->
  <circle cx="256" cy="250" r="140" fill="#10b981" fill-opacity="0.08" />

  <!-- Antenna Assembly -->
  <g id="antenna">
    <!-- Antenna base -->
    <rect x="250" y="108" width="12" height="16" rx="3" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <!-- Antenna rod -->
    <line x1="256" y1="110" x2="256" y2="72" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
    <!-- Glow aura -->
    <circle cx="256" cy="66" r="22" fill="url(#eggbot-antenna-glow)" opacity="0.85" />
    <!-- Antenna LED tip -->
    <circle cx="256" cy="66" r="8" fill="#34d399" filter="url(#eggbot-eye-glow)" />
    <circle cx="256" cy="66" r="3.5" fill="#ffffff" />
  </g>

  <!-- EggBot Body Chassis (Iconic egg silhouette) -->
  <g id="body-chassis">
    <!-- Outer Egg Shadow -->
    <path d="M 172 400 C 145 285, 175 120, 256 120 C 337 120, 367 285, 340 400 C 322 432, 190 432, 172 400 Z" fill="#0b1714" opacity="0.4" />
    
    <!-- Egg Robot Main Hull -->
    <path d="M 175 395 C 150 285, 178 125, 256 125 C 334 125, 362 285, 337 395 C 320 426, 192 426, 175 395 Z" fill="url(#eggbot-chassis)" stroke="#233530" stroke-width="2.5" />

    <!-- Forehead Tech Seam / Panel Line -->
    <path d="M 200 178 C 230 168, 282 168, 312 178" fill="none" stroke="#526862" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="256" cy="172" r="2.5" fill="#10b981" opacity="0.8" />

    <!-- Side Sensor Bolts -->
    <circle cx="168" cy="270" r="5" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="168" cy="270" r="1.8" fill="#10b981" />
    <circle cx="344" cy="270" r="5" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="344" cy="270" r="1.8" fill="#10b981" />
  </g>

  <!-- Digital Glasses / Robot Visor Unit -->
  <g id="robot-glasses">
    <!-- Glasses Frames (Left & Right rounded squircle) -->
    <rect x="194" y="222" width="54" height="48" rx="14" fill="url(#eggbot-visor)" stroke="#0e1b17" stroke-width="5" />
    <rect x="264" y="222" width="54" height="48" rx="14" fill="url(#eggbot-visor)" stroke="#0e1b17" stroke-width="5" />

    <!-- Glasses Bridge -->
    <line x1="248" y1="244" x2="264" y2="244" stroke="#0e1b17" stroke-width="5.5" stroke-linecap="round" />
    <!-- Glasses Temples -->
    <line x1="194" y1="244" x2="168" y2="252" stroke="#0e1b17" stroke-width="4.5" stroke-linecap="round" />
    <line x1="318" y1="244" x2="344" y2="252" stroke="#0e1b17" stroke-width="4.5" stroke-linecap="round" />

    <!-- Glowing Digital LED Eyes -->
    <g id="digital-eyes" filter="url(#eggbot-eye-glow)">
      <!-- Left Eye -->
      <ellipse cx="221" cy="245" rx="11" ry="13" fill="#10b981" />
      <circle cx="218" cy="240" r="4.5" fill="#ffffff" />
      <circle cx="225" cy="248" r="2" fill="#a7f3d0" />

      <!-- Right Eye -->
      <ellipse cx="291" cy="245" rx="11" ry="13" fill="#10b981" />
      <circle cx="288" cy="240" r="4.5" fill="#ffffff" />
      <circle cx="295" cy="248" r="2" fill="#a7f3d0" />
    </g>

    <!-- Glass Lens Glare Reflection -->
    <path d="M 200 228 L 226 228 L 204 262 L 200 262 Z" fill="#ffffff" opacity="0.12" />
    <path d="M 270 228 L 296 228 L 274 262 L 270 262 Z" fill="#ffffff" opacity="0.12" />
  </g>

  <!-- Digital Face Elements -->
  <g id="face-expression">
    <!-- Digital LED Cheeks (Pinkish Neon Glow) -->
    <ellipse cx="188" cy="280" rx="9" ry="5" fill="#f87171" opacity="0.55" filter="url(#eggbot-eye-glow)" />
    <ellipse cx="324" cy="280" rx="9" ry="5" fill="#f87171" opacity="0.55" filter="url(#eggbot-eye-glow)" />

    <!-- Smiling Curved Digital Mouth -->
    <path d="M 244 286 Q 256 296 268 286" stroke="#0e1b17" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 245 287 Q 256 295 267 287" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- Chest Plate & neoMailer Emblem -->
  <g id="chest-badge" transform="translate(230, 328)">
    <!-- Plate base -->
    <rect x="0" y="0" width="52" height="34" rx="8" fill="#1e2e28" stroke="#33473f" stroke-width="1.5" />
    <!-- neoMailer Mini Envelope -->
    <g transform="translate(9, 6) scale(0.076)">
      <path d="M 45 0 L 405 0 C 429.9 0 448.9 19 449.2 35 C 375 65 295 115 225 145 C 157 116 82 61 12 36 C 18 20 29 9 45 0 Z" fill="#10b981" />
      <path d="M 0 45 C 0 20.1 20.1 0 45 0 C 29 9 18 20 12 36 C 82 96 162 156 228 209 C 200 205 180 201 165 199 C 125 214 85 264 45 290 C 20.1 290 0 270 0 245 Z" fill="#087d54" />
      <path d="M 228 209 C 298 178 378 88 450 62 L 450 245 C 450 270 429.9 290 405 290 L 300 290 C 255 274 210 209 165 199 C 180 201 200 205 228 209 Z" fill="#055239" />
    </g>
    <!-- Mini Status LED on Badge -->
    <circle cx="43" cy="25" r="2" fill="#34d399" filter="url(#eggbot-eye-glow)" />
  </g>

  <!-- Robot Floating Arm / Hands -->
  <g id="robot-hands">
    <!-- Left Hand -->
    <ellipse cx="165" cy="365" rx="16" ry="12" fill="#142822" stroke="#253d35" stroke-width="2" />
    <circle cx="165" cy="365" r="3.5" fill="#10b981" opacity="0.6" />

    <!-- Right Hand -->
    <ellipse cx="347" cy="365" rx="16" ry="12" fill="#142822" stroke="#253d35" stroke-width="2" />
    <circle cx="347" cy="365" r="3.5" fill="#10b981" opacity="0.6" />
  </g>
</svg>
