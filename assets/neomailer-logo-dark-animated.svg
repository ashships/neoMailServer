<?xml version="1.0" encoding="UTF-8"?>
<!-- neoMailer Official Animated Logo (Vector SVG) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" fill="none">
  <defs>
    <!-- Top Flap Gradient: neoMailer Primary Emerald -->
    <linearGradient id="nm-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0eb958">
        <animate attributeName="stop-color" values="#0eb958;#14dc72;#0eb958" dur="3.2s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#087d54" />
      <stop offset="100%" stop-color="#055239" />
    </linearGradient>

    <!-- Bottom Left Flap Gradient -->
    <linearGradient id="nm-bot-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0eb958" />
      <stop offset="50%" stop-color="#087d54">
        <animate attributeName="stop-color" values="#087d54;#0aa870;#087d54" dur="3.2s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#055239" />
    </linearGradient>

    <!-- Bottom Right Flap Gradient (Deeper Shadow at Crease) -->
    <linearGradient id="nm-bot-right-grad" x1="0%" y1="40%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#033b28" />
      <stop offset="18%" stop-color="#055f42" />
      <stop offset="65%" stop-color="#087d54" />
      <stop offset="100%" stop-color="#0ea868">
        <animate attributeName="stop-color" values="#0ea868;#14d481;#0ea868" dur="3.2s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmer Glint Beam -->
    <linearGradient id="nm-shimmer-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="47%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="53%" stop-color="#a7f3d0" stop-opacity="0.60" />
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Rounded Envelope Mask (R = 45) -->
    <clipPath id="nm-envelope-clip">
      <rect x="0" y="0" width="450" height="290" rx="45" ry="45" />
    </clipPath>

    <!-- Ground Shadow Filter -->
    <filter id="nm-ground-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" />
    </filter>

    <!-- Ambient Aura Glow Filter -->
    <filter id="nm-ambient-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes nmLevitate {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-13px) rotate(0.4deg);
        }
      }

      @keyframes nmShadowBreathe {
        0%, 100% {
          transform: scale(1);
          opacity: 0.65;
        }
        50% {
          transform: scale(0.84) translateY(3px);
          opacity: 0.35;
        }
      }

      @keyframes nmShimmerSweep {
        0%, 10% {
          transform: translateX(-480px) rotate(25deg);
          opacity: 0;
        }
        18% {
          opacity: 1;
        }
        60% {
          transform: translateX(620px) rotate(25deg);
          opacity: 1;
        }
        65%, 100% {
          transform: translateX(620px) rotate(25deg);
          opacity: 0;
        }
      }

      @keyframes nmSparkleTwinkle {
        0%, 50% {
          transform: translate(448px, 48px) scale(0) rotate(0deg);
          opacity: 0;
        }
        58% {
          transform: translate(448px, 48px) scale(1.35) rotate(45deg);
          opacity: 1;
        }
        68% {
          transform: translate(448px, 48px) scale(0.2) rotate(90deg);
          opacity: 0;
        }
        100% {
          transform: translate(448px, 48px) scale(0) rotate(90deg);
          opacity: 0;
        }
      }

      @keyframes nmAuraPulse {
        0%, 100% {
          opacity: 0.35;
          transform: scale(0.98);
        }
        50% {
          opacity: 0.75;
          transform: scale(1.03);
        }
      }

      .nm-floating-body {
        transform-origin: 225px 145px;
        animation: nmLevitate 3.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .nm-shadow {
        transform-origin: 300px 386px;
        animation: nmShadowBreathe 3.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .nm-shimmer-pass {
        animation: nmShimmerSweep 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        transform-origin: center;
      }

      .nm-sparkle {
        animation: nmSparkleTwinkle 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        transform-origin: 0 0;
      }

      .nm-ambient-aura {
        transform-origin: 225px 145px;
        animation: nmAuraPulse 3.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="600" height="440" fill="#090e17" />

  <!-- Ground Ambient Shadow -->
  <g class="nm-shadow">
    <ellipse cx="300" cy="386" rx="170" ry="16" fill="rgba(0, 0, 0, 0.65)" filter="url(#nm-ground-shadow)" />
  </g>

  <!-- Centered Floating Logo Assembly -->
  <g transform="translate(75, 62)">
    <g class="nm-floating-body">
      <!-- Soft Ambient Aura Glow behind the envelope -->
      <rect class="nm-ambient-aura" x="25" y="15" width="400" height="260" rx="45" fill="rgba(14, 185, 88, 0.30)" filter="url(#nm-ambient-glow)" />

      <!-- Clipped Envelope Body -->
      <g clip-path="url(#nm-envelope-clip)">
        <!-- Solid Base Card -->
        <rect x="0" y="0" width="450" height="290" fill="#ffffff" />

        <!-- Top Flap -->
        <path d="M 45 0
                 L 405 0
                 C 429.9 0 448.9 19 449.2 35
                 C 375 65 295 115 225 145
                 C 157 116 82 61 12 36
                 C 18 20 29 9 45 0 Z"
              fill="url(#nm-top-grad)" />

        <!-- Bottom Left Flap -->
        <path d="M 0 45
                 C 0 20.1 20.1 0 45 0
                 C 29 9 18 20 12 36
                 C 82 96 162 156 228 209
                 C 200 205 180 201 165 199
                 C 125 214 85 264 45 290
                 C 20.1 290 0 270 0 245 Z"
              fill="url(#nm-bot-left-grad)" />

        <!-- Bottom Right Flap -->
        <path d="M 228 209
                 C 298 178 378 88 450 62
                 L 450 245
                 C 450 270 429.9 290 405 290
                 L 300 290
                 C 255 274 210 209 165 199
                 C 180 201 200 205 228 209 Z"
              fill="url(#nm-bot-right-grad)" />

        <!-- White Checkmark Ribbon -->
        <path d="M 12 36
                 C 82 61 157 116 225 145
                 C 295 115 375 65 449.2 35
                 C 449.8 40 450 45 450 48
                 L 450 62
                 C 378 88 298 178 228 209
                 C 162 156 82 96 12 36 Z"
              fill="#ffffff" />

        <!-- Dynamic Diagonal Shimmer Pass -->
        <g class="nm-shimmer-pass">
          <rect x="-100" y="-120" width="160" height="520" fill="url(#nm-shimmer-beam)" />
        </g>
      </g>

      <!-- Gloss Sparkle Star at Checkmark Crest -->
      <g class="nm-sparkle">
        <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#ffffff" filter="drop-shadow(0 0 5px #34d399)" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
      </g>
    </g>
  </g>
</svg>